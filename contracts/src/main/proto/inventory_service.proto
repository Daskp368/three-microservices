syntax = "proto3";

package inventory.v1;

option java_package = "ru.pavelshadrin.shop.contracts.inventory.v1";
option java_multiple_files = true;
option java_outer_classname = "InventoryServiceProto";

service InventoryService {
  rpc checkAvailability(ProductRequest) returns (ProductResponse);
}

message ProductRequest {
  string product_id = 1;
  int32 requested_quantity = 2;
}

message ProductResponse {
  string product_id = 1;
  string name = 2;
  int32 available_quantity = 3;
  string price = 4;
  string sale = 5;
  bool available = 6;
}
