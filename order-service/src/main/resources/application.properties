spring.application.name=order-service
spring.profiles.default=local
spring.config.import=optional:file:./.env/order.properties,optional:file:../.env/order.properties
spring.jackson.time-zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
app.security.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:7d}

app.security.local-admin.enabled=${LOCAL_ADMIN_ENABLED:false}
app.security.local-admin.username=${LOCAL_ADMIN_USERNAME:}
app.security.local-admin.email=${LOCAL_ADMIN_EMAIL:}
app.security.local-admin.password=${LOCAL_ADMIN_PASSWORD:}

app.inventory.grpc.host=${INVENTORY_GRPC_HOST:localhost}
app.inventory.grpc.port=${INVENTORY_GRPC_PORT:9090}
app.inventory.grpc.deadline=${INVENTORY_GRPC_DEADLINE:2s}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

app.outbox.publisher-delay=${OUTBOX_PUBLISHER_DELAY:1s}
app.outbox.send-timeout=${OUTBOX_SEND_TIMEOUT:5s}
app.outbox.publisher-enabled=${OUTBOX_PUBLISHER_ENABLED:true}

server.port=${ORDER_HTTP_PORT:8081}
