spring.application.name=notification-service
spring.profiles.default=local
spring.config.import=optional:file:./.env/notification.properties,optional:file:../.env/notification.properties
spring.jackson.time-zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${NOTIFICATION_KAFKA_GROUP_ID:notification-service}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record

app.kafka.orders-topic=orders
app.kafka.listener-enabled=${NOTIFICATION_KAFKA_LISTENER_ENABLED:true}

server.port=${NOTIFICATION_HTTP_PORT:8083}
